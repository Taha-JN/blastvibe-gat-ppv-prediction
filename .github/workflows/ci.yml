name: Production ML CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Quality, Safety & Test Verification (${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Project & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Code Quality & Type Safety Verification
        run: |
          ruff check src/ tests/
          black --check src/ tests/
          mypy src/

      - name: Verify Mathematical Invariants & Anti-Leakage Contracts
        run: |
          pytest -v tests/
